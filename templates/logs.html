{% extends "layout.html" %}
{% block content %}

<h2 class="page-title">User Listening History</h2>

<form method="POST" class="mb-4">
    <input type="number" class="form-control" name="user_id" placeholder="User ID" required>
    <button class="btn btn-primary mt-2">View Logs</button>
</form>

{% if logs %}
<ul class="list-group">
    {% for log in logs %}
    <li class="list-group-item">
        <strong>{{ log[0] }}</strong> by {{ log[1] }}
        <span class="badge bg-warning text-dark">★ {{ log[2] }}</span>
        <br><small>{{ log[3] }}</small>
    </li>
    {% endfor %}
</ul>
{% endif %}

{% endblock %}
