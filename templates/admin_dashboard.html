{% extends "layout.html" %}

{% block content %}
<div class="row admin-dashboard">
    <div class="col-md-6 admin-card">
        <h3>Albums</h3>
        <table class="table table-sm">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Year</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for a in albums %}
                <tr>
                    <td>{{ a['id'] }}</td>
                    <td>{{ a['title'] }}</td>
                    <td>{{ a['release_year'] }}</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" href="{{ url_for('admin_edit_album', album_id=a['id']) }}">Edit</a>

                        <form method="POST" action="{{ url_for('admin_delete_album', album_id=a['id']) }}" style="display:inline-block;" onsubmit="return confirm('Delete this album?');">
                            <button class="btn btn-sm btn-danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="col-md-6 admin-card">
        <h3>Users</h3>
        <table class="table table-sm">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for u in users %}
                <tr>
                    <td>{{ u['id'] }}</td>
                    <td>{{ u['username'] }}</td>
                    <td>{{ u['email'] }}</td>
                    <td class="text-end">
                        <form method="POST" action="{{ url_for('admin_delete_user_logs', user_id=u['id']) }}" style="display:inline-block;">
                            <button class="btn btn-sm btn-warning">Delete Logs</button>
                        </form>

                        <form method="POST" action="{{ url_for('admin_delete_user', user_id=u['id']) }}" style="display:inline-block;" onsubmit="return confirm('Delete user and all related data?');">
                            <button class="btn btn-sm btn-danger">Delete User</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
