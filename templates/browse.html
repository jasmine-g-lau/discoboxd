{% extends "layout.html" %}
{% block content %}

<h2 class="page-title">Browse Albums</h2>

<div class="row">
    {% for album in albums %}
    <div class="col-md-3 mb-4">
        <div class="card shadow-sm">

            <img src="{{ url_for('static', filename=album[4]) }}" class="album-img">

            <div class="p-3">
                <h5>{{ album[1] }}</h5>
                <p class="text-muted">{{ album[2] }} • {{ album[3] }}</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
