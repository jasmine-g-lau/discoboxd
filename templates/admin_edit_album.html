{% extends "layout.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2>Edit Album</h2>

            <form method="POST" action="{{ url_for('admin_edit_album', album_id=album['id']) }}">
                <div class="mb-3">
                    <label for="title" class="form-label">Album Title *</label>
                    <input type="text" class="form-control" id="title" name="title" 
                           value="{{ album['title'] }}" required>
                </div>

                <div class="mb-3">
                    <label for="release_year" class="form-label">Release Year</label>
                    <input type="number" class="form-control" id="release_year" name="release_year" 
                           value="{{ album['release_year'] if album['release_year'] else '' }}"
                           placeholder="e.g., 2024" min="1900" max="2100">
                </div>

                <div class="mb-3">
                    <label for="cover_image" class="form-label">Cover Image URL</label>
                    <input type="text" class="form-control" id="cover_image" name="cover_image" 
                           value="{{ album['cover_image'] if album['cover_image'] else '' }}"
                           placeholder="albumCover/dog.jpg">
                </div>

                <div class="mb-3">
                    <label for="artists" class="form-label">Artists</label>
                    <input type="text" class="form-control" id="artists" name="artists" 
                           value="{{ current_artists }}"
                           placeholder="e.g., The Beatles, John Lennon">
                    <small class="form-text text-muted">Enter artist names separated by commas. New artists will be created automatically.</small>
                </div>

                <div class="mb-3">
                    <label for="genres" class="form-label">Genres</label>
                    <select multiple class="form-select" id="genres" name="genres" size="8">
                        {% for genre in all_genres %}
                        <option value="{{ genre['id'] }}" 
                                {% if genre['id'] in current_genre_ids %}selected{% endif %}>
                            {{ genre['name'] }}
                        </option>
                        {% endfor %}
                    </select>
                    <small class="form-text text-muted">Hold Ctrl (Windows/Linux) or Cmd (Mac) to select multiple genres</small>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Update Album</button>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
